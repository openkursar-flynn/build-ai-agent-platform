<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-labelledby="t"><title id="t">图 3-13 模型上下文与磁盘状态错位</title><style>svg{--fg:#1f2328;--muted:#6b7280;--line:#c8d1da;--accent:#b45309;--danger:#b42318;--panel:#f7f9fb}text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.h{fill:var(--fg);font-size:17px;font-weight:600}.pt{fill:var(--fg);font-size:15px;font-weight:600}.tx{fill:var(--fg);font-size:13px}.sm{fill:var(--muted);font-size:12px}.acc{fill:var(--accent);font-size:12.5px;font-weight:600}.danger{fill:var(--danger);font-size:12.5px;font-weight:600}.panel{fill:var(--panel);stroke:var(--line)}.file{fill:#fff;stroke:var(--line)}.changed{fill:#fff8ef;stroke:var(--accent)}.failed{fill:#fff5f3;stroke:var(--danger)}.ln{stroke:var(--line);stroke-width:1.5;fill:none}.la{stroke:var(--accent);stroke-width:2;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker></defs><text class="h" x="500" y="36" text-anchor="middle">写操作改变了磁盘，但不会自动改写模型记忆</text><rect class="panel" x="55" y="75" width="350" height="310" rx="10"/><text class="pt" x="230" y="110" text-anchor="middle">模型上下文里的文件</text><text class="sm" x="230" y="135" text-anchor="middle">写入前读到的版本</text><rect class="file" x="90" y="162" width="280" height="158" rx="7"/><text class="tx" x="112" y="193">① SECRET_KEY</text><text class="tx" x="112" y="228">② timeout = 10</text><text class="tx" x="112" y="263">③ cache = false</text><text class="sm" x="230" y="350" text-anchor="middle">仍认为三处都是旧状态</text><rect class="panel" x="595" y="75" width="350" height="310" rx="10"/><text class="pt" x="770" y="110" text-anchor="middle">磁盘上的文件</text><text class="sm" x="770" y="135" text-anchor="middle">批量写入后的真实版本</text><rect class="changed" x="630" y="162" width="280" height="42" rx="7"/><text class="acc" x="652" y="188">① AUTH_SECRET　已修改</text><rect class="changed" x="630" y="216" width="280" height="42" rx="7"/><text class="acc" x="652" y="242">② timeout = 30　已修改</text><rect class="failed" x="630" y="270" width="280" height="42" rx="7"/><text class="danger" x="652" y="296">③ 匹配失败　未修改</text><path class="la" d="M410 255H582" marker-end="url(#a)"/><rect x="418" y="184" width="164" height="54" rx="7" fill="#fff8ef" stroke="#b45309"/><text class="acc" x="500" y="207" text-anchor="middle">工具返回文本</text><text class="sm" x="500" y="227" text-anchor="middle">唯一的对齐通道</text><text class="danger" x="500" y="410" text-anchor="middle">如果只返回“部分失败”，模型无法知道现场究竟变成了什么</text></svg>
