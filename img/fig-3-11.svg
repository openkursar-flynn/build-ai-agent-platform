<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-labelledby="t"><title id="t">图 3-11 三层记忆的生命周期</title><style>svg{--fg:#1f2328;--muted:#6b7280;--line:#c8d1da;--accent:#b45309;--panel:#f7f9fb}text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.h{fill:var(--fg);font-size:17px;font-weight:600}.pt{fill:var(--fg);font-size:15px;font-weight:600}.tx{fill:var(--fg);font-size:13px}.sm{fill:var(--muted);font-size:12px}.acc{fill:var(--accent);font-size:12.5px;font-weight:600}.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.2}.focus{fill:#fff8ef;stroke:var(--accent);stroke-width:1.5}.line{stroke:var(--line);stroke-width:1.3}</style><text class="h" x="500" y="36" text-anchor="middle">三种记忆回答三个不同的问题</text><rect class="panel" x="60" y="84" width="260" height="278" rx="10"/><text class="pt" x="84" y="119">对话历史</text><text class="sm" x="84" y="146">发生过什么？</text><line class="line" x1="80" y1="166" x2="300" y2="166"/><text class="tx" x="84" y="198">自动追加的流水账</text><text class="tx" x="84" y="228">随每轮不断增长</text><text class="tx" x="84" y="258">接近上限时会压缩</text><text class="sm" x="84" y="322">生命周期：一次会话</text><rect class="focus" x="370" y="68" width="260" height="310" rx="10"/><text class="pt" x="394" y="108">工作记忆</text><text class="acc" x="394" y="136">现在是什么？</text><line class="line" x1="390" y1="156" x2="610" y2="156"/><text class="tx" x="394" y="190">任务目标与约束</text><text class="tx" x="394" y="220">待办清单与当前状态</text><text class="tx" x="394" y="250">按条件回注到上下文末尾</text><text class="acc" x="394" y="280">独立保存，从不参与压缩</text><text class="sm" x="394" y="338">生命周期：一个任务</text><rect class="panel" x="680" y="84" width="260" height="278" rx="10"/><text class="pt" x="704" y="119">长期记忆</text><text class="sm" x="704" y="146">以后还要知道什么？</text><line class="line" x1="700" y1="166" x2="920" y2="166"/><text class="tx" x="704" y="198">跨任务保留的事实</text><text class="tx" x="704" y="228">偏好、经验与沉淀</text><text class="tx" x="704" y="258">检索后才进入上下文</text><text class="sm" x="704" y="322">生命周期：跨会话</text><text class="acc" x="810" y="397" text-anchor="middle">第七章展开</text></svg>
