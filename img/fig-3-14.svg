<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="t"><title id="t">图 3-14 循环停滞与提前退出的干预位置</title><style>svg{--fg:#1f2328;--muted:#6b7280;--line:#c8d1da;--accent:#b45309;--danger:#b42318;--panel:#f7f9fb}text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.h{fill:var(--fg);font-size:17px;font-weight:600}.pt{fill:var(--fg);font-size:14px;font-weight:600}.tx{fill:var(--fg);font-size:12.5px}.sm{fill:var(--muted);font-size:11.8px}.acc{fill:var(--accent);font-size:12.2px;font-weight:600}.panel{fill:var(--panel);stroke:var(--line)}.box{fill:#fff;stroke:var(--line)}.focus{fill:#fff8ef;stroke:var(--accent);stroke-width:1.4}.end{fill:#fff5f3;stroke:var(--danger)}.ln{stroke:var(--line);stroke-width:1.5;fill:none}.la{stroke:var(--accent);stroke-width:1.8;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c8d1da"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker></defs><text class="h" x="500" y="34" text-anchor="middle">继续与退出，是两条不同的异常检测路径</text><rect class="box" x="405" y="58" width="190" height="48" rx="8"/><text class="pt" x="500" y="88" text-anchor="middle">模型本轮返回</text><path class="ln" d="M455 106L250 152" marker-end="url(#a)"/><path class="ln" d="M545 106L750 152" marker-end="url(#a)"/><text class="sm" x="316" y="126">有工具调用</text><text class="sm" x="684" y="126">无工具调用</text><rect class="panel" x="50" y="156" width="420" height="328" rx="11"/><text class="pt" x="74" y="188">循环停滞：还在动，但没有新信息</text><rect class="box" x="82" y="212" width="356" height="48" rx="7"/><text class="tx" x="260" y="241" text-anchor="middle">执行工具 → 写回结果</text><path class="ln" d="M260 260V294" marker-end="url(#a)"/><rect class="focus" x="82" y="302" width="356" height="72" rx="7"/><text class="acc" x="102" y="328">检查最近调用历史</text><text class="tx" x="102" y="352">工具、参数、错误重复且没有新结果？</text><path class="la" d="M260 374V406" marker-end="url(#aa)"/><rect class="focus" x="82" y="414" width="356" height="44" rx="7"/><text class="acc" x="260" y="441" text-anchor="middle">把“重复模式”附到最新工具结果</text><path class="ln" d="M82 436H66V236H74" marker-end="url(#a)"/><rect class="panel" x="530" y="156" width="420" height="328" rx="11"/><text class="pt" x="554" y="188">提前退出：停下了，但任务可能未完成</text><rect class="focus" x="562" y="212" width="356" height="72" rx="7"/><text class="acc" x="582" y="238">退出检查</text><text class="tx" x="582" y="262">工作记忆未完成项 + 可执行验收条件</text><path class="la" d="M740 284V318" marker-end="url(#aa)"/><rect class="focus" x="562" y="326" width="162" height="66" rx="7"/><text class="acc" x="643" y="351" text-anchor="middle">仍未完成</text><text class="tx" x="643" y="374" text-anchor="middle">注入状态，继续</text><rect class="box" x="756" y="326" width="162" height="66" rx="7"/><text class="pt" x="837" y="351" text-anchor="middle">状态不足</text><text class="tx" x="837" y="374" text-anchor="middle">观察者或用户判断</text><path class="ln" d="M724 359H748" marker-end="url(#a)"/><path class="ln" d="M837 392V418" marker-end="url(#a)"/><rect class="end" x="756" y="426" width="162" height="36" rx="7"/><text x="837" y="449" text-anchor="middle" style="fill:#b42318;font-size:12.5px;font-weight:600;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">确认完成 → 退出</text></svg>
