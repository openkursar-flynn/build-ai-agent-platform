<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-labelledby="t"><title id="t">图 3-12 报错措辞决定失败后的路径</title><style>svg{--fg:#1f2328;--muted:#6b7280;--line:#c8d1da;--accent:#b45309;--danger:#b42318;--panel:#f7f9fb}text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.h{fill:var(--fg);font-size:17px;font-weight:600}.pt{fill:var(--fg);font-size:14px;font-weight:600}.tx{fill:var(--fg);font-size:12.8px}.sm{fill:var(--muted);font-size:12px}.acc{fill:var(--accent);font-size:12.5px;font-weight:600}.danger{fill:var(--danger);font-size:12.5px;font-weight:600}.panel{fill:var(--panel);stroke:var(--line)}.box{fill:#fff;stroke:var(--line)}.good{fill:#fff8ef;stroke:var(--accent)}.bad{fill:#fff5f3;stroke:var(--danger)}.ln{stroke:var(--line);stroke-width:1.5;fill:none}.la{stroke:var(--accent);stroke-width:1.8;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c8d1da"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker></defs><text class="h" x="500" y="36" text-anchor="middle">能力相同，反馈不同，后续轮次完全不同</text><rect class="panel" x="55" y="70" width="890" height="132" rx="10"/><text class="pt" x="78" y="101">裸报错</text><rect class="bad" x="78" y="120" width="170" height="48" rx="7"/><text class="danger" x="163" y="149" text-anchor="middle">Error: edit failed</text><path class="ln" d="M248 144H325" marker-end="url(#a)"/><rect class="box" x="333" y="120" width="138" height="48" rx="7"/><text class="tx" x="402" y="149" text-anchor="middle">猜参数？</text><path class="ln" d="M471 144H532" marker-end="url(#a)"/><rect class="box" x="540" y="120" width="138" height="48" rx="7"/><text class="tx" x="609" y="149" text-anchor="middle">换写法重试</text><path class="ln" d="M678 144H739" marker-end="url(#a)"/><rect class="bad" x="747" y="120" width="170" height="48" rx="7"/><text class="danger" x="832" y="149" text-anchor="middle">再次失败</text><text class="sm" x="500" y="188" text-anchor="middle">原因未知，只能用轮次试探</text><rect class="panel" x="55" y="224" width="890" height="150" rx="10"/><text class="pt" x="78" y="255">带方向的报错</text><rect class="good" x="78" y="274" width="390" height="66" rx="7"/><text class="acc" x="98" y="299">替换目标出现 3 次，无法唯一定位</text><text class="tx" x="98" y="323">请增加上下文，或使用 replace_all</text><path class="la" d="M468 307H620" marker-end="url(#aa)"/><rect class="good" x="628" y="274" width="289" height="66" rx="7"/><text class="acc" x="772" y="299" text-anchor="middle">提供唯一上下文</text><text class="tx" x="772" y="323" text-anchor="middle">下一轮直接修正</text><text class="acc" x="500" y="361" text-anchor="middle">失败原因 + 下一步 = 一轮完成</text></svg>
