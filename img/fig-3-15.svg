<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="t"><title id="t">图 3-15 Hook 介入工具调用过程</title><style>svg{--fg:#1f2328;--muted:#6b7280;--line:#c8d1da;--accent:#b45309;--danger:#b42318;--panel:#f7f9fb}text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.h{fill:var(--fg);font-size:17px;font-weight:600}.pt{fill:var(--fg);font-size:14px;font-weight:600}.tx{fill:var(--fg);font-size:12.8px}.sm{fill:var(--muted);font-size:12px}.acc{fill:var(--accent);font-size:12.5px;font-weight:600}.box{fill:#fff;stroke:var(--line)}.hook{fill:#fff8ef;stroke:var(--accent);stroke-width:1.5}.reject{fill:#fff5f3;stroke:var(--danger)}.ln{stroke:var(--line);stroke-width:1.6;fill:none}.la{stroke:var(--accent);stroke-width:1.8;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c8d1da"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker></defs><text class="h" x="500" y="36" text-anchor="middle">Hook 在影响发生前后介入，但所有结果都回到上下文</text><rect class="box" x="70" y="188" width="160" height="60" rx="8"/><text class="pt" x="150" y="214" text-anchor="middle">模型提出调用</text><text class="sm" x="150" y="235" text-anchor="middle">工具名 + 参数</text><path class="ln" d="M230 218H286" marker-end="url(#a)"/><rect class="hook" x="294" y="168" width="180" height="100" rx="9"/><text class="acc" x="384" y="196" text-anchor="middle">执行前 Hook</text><text class="tx" x="384" y="221" text-anchor="middle">放行 / 修改参数 / 拒绝</text><text class="sm" x="384" y="245" text-anchor="middle">检查可验证的事实</text><path class="la" d="M474 205H530" marker-end="url(#aa)"/><text class="sm" x="502" y="192" text-anchor="middle">放行</text><rect class="box" x="538" y="188" width="160" height="60" rx="8"/><text class="pt" x="618" y="224" text-anchor="middle">执行工具</text><path class="ln" d="M698 218H754" marker-end="url(#a)"/><rect class="hook" x="762" y="168" width="168" height="100" rx="9"/><text class="acc" x="846" y="196" text-anchor="middle">执行后 Hook</text><text class="tx" x="846" y="221" text-anchor="middle">处理成功或失败</text><text class="sm" x="846" y="245" text-anchor="middle">补充、改写结果</text><path class="ln" d="M846 268V340H604" marker-end="url(#a)"/><path class="la" d="M384 268V304" marker-end="url(#aa)"/><text class="sm" x="397" y="291">拒绝</text><rect class="reject" x="294" y="312" width="180" height="62" rx="8"/><text x="384" y="337" text-anchor="middle" style="fill:#b42318;font-size:12.5px;font-weight:600;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">不执行工具</text><text class="tx" x="384" y="359" text-anchor="middle">生成带原因的工具结果</text><path class="ln" d="M474 343H530" marker-end="url(#a)"/><rect class="box" x="538" y="312" width="240" height="62" rx="8"/><text class="pt" x="658" y="337" text-anchor="middle">结果写回模型上下文</text><text class="sm" x="658" y="359" text-anchor="middle">真实执行结果或明确拒绝原因</text><path class="ln" d="M658 374V416H150V256" marker-end="url(#a)"/><text class="sm" x="404" y="435" text-anchor="middle">进入模型下一轮</text></svg>
