<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-labelledby="t"><title id="t">图 3-5 历史只增不减，任务越长，离上限越近</title><style>svg{--fg:#1f2328;--muted:#6b7280;--line:#c8d1da;--accent:#b45309;--danger:#b42318}text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.h{fill:var(--fg);font-size:17px;font-weight:600}.tx{fill:var(--fg);font-size:13.5px}.sm{fill:var(--muted);font-size:12.5px}.axis{stroke:var(--line);stroke-width:1.3}.grid{stroke:var(--line);stroke-width:1;stroke-dasharray:4 6}.curve{fill:none;stroke:var(--accent);stroke-width:3}.limit{stroke:var(--danger);stroke-width:1.5;stroke-dasharray:7 5}.danger{fill:var(--danger);font-size:13px;font-weight:600}.dot{fill:var(--danger)}</style><text class="h" x="500" y="38" text-anchor="middle">完整历史每轮重发，只会向窗口上限靠近</text><line class="axis" x1="110" y1="350" x2="920" y2="350"/><line class="axis" x1="110" y1="350" x2="110" y2="70"/><line class="grid" x1="110" y1="224" x2="920" y2="224"/><line class="limit" x1="110" y1="98" x2="920" y2="98"/><text class="danger" x="116" y="88">上下文窗口上限 · 20 万 token</text><text class="sm" x="96" y="354" text-anchor="end">0</text><text class="sm" x="96" y="228" text-anchor="end">10 万</text><text class="sm" x="96" y="102" text-anchor="end">20 万</text><text class="tx" x="515" y="402" text-anchor="middle">任务轮次</text><text class="tx" x="38" y="214" text-anchor="middle" transform="rotate(-90 38 214)">上下文用量</text><path class="curve" d="M110 342 C205 330 252 312 320 294 S440 258 505 225 S636 181 705 145 S816 112 865 98"/><circle class="dot" cx="865" cy="98" r="6"/><line class="limit" x1="865" y1="98" x2="865" y2="350"/><text class="danger" x="850" y="132" text-anchor="end">任务中断</text><text class="sm" x="850" y="153" text-anchor="end">API 拒绝超长请求</text><text class="sm" x="230" y="326">文件内容</text><text class="sm" x="445" y="262">命令输出</text><text class="sm" x="660" y="177">更多工具结果</text></svg>
