<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" role="img" aria-labelledby="t"><title id="t">图 3-6 滑动窗口按新旧取舍，最先停发的恰恰是任务本身</title><style>svg{--fg:#1f2328;--muted:#6b7280;--line:#c8d1da;--accent:#b45309;--danger:#b42318;--box:#fff}text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.h{fill:var(--fg);font-size:17px;font-weight:600}.tx{fill:var(--fg);font-size:13.5px}.sm{fill:var(--muted);font-size:12.5px}.danger{fill:var(--danger);font-size:13px;font-weight:600}.old{fill:#f1f3f5;stroke:#d7dde3}.keep{fill:var(--box);stroke:var(--line)}.task{fill:#fff5f3;stroke:var(--danger);stroke-width:1.4}.cut{stroke:var(--accent);stroke-width:2;stroke-dasharray:7 5}.x{stroke:var(--danger);stroke-width:2}</style><text class="h" x="500" y="38" text-anchor="middle">滑动窗口只认识时间，不认识信息价值</text><text class="sm" x="218" y="71" text-anchor="middle">最旧</text><text class="sm" x="782" y="71" text-anchor="middle">最新</text><rect class="task" x="90" y="92" width="820" height="48" rx="7"/><text class="danger" x="112" y="122">[用户] 修复登录报错，注意别动现有 API 接口</text><rect class="old" x="116" y="154" width="768" height="42" rx="7"/><text class="sm" x="138" y="180">[工具] 读取 login.ts，共 2000 行</text><rect class="old" x="142" y="210" width="716" height="42" rx="7"/><text class="sm" x="164" y="236">[助手] 排查环境变量与 token 校验逻辑</text><line class="cut" x1="75" y1="272" x2="925" y2="272"/><rect x="394" y="258" width="212" height="28" rx="14" fill="#fff"/><text x="500" y="277" text-anchor="middle" style="fill:#b45309;font-size:12.5px;font-weight:600;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">窗口切口 · 上方停止发送</text><rect class="keep" x="168" y="300" width="664" height="42" rx="7"/><text class="tx" x="190" y="326">[工具] Expected 200, received 401</text><rect class="keep" x="194" y="356" width="612" height="42" rx="7"/><text class="tx" x="216" y="382">[助手] 继续修改当前配置文件……</text><line class="x" x1="860" y1="103" x2="884" y2="129"/><line class="x" x1="884" y1="103" x2="860" y2="129"/><text class="danger" x="842" y="421" text-anchor="end">只剩执行细节：这一切原本是为了什么？</text><text class="danger" x="868" y="384" font-size="28">?</text></svg>
