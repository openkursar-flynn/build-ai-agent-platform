<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="t"><title id="t">图 3-16 业务规则通过 Hook 进入流程</title><style>svg{--fg:#1f2328;--muted:#6b7280;--line:#c8d1da;--accent:#b45309;--danger:#b42318;--panel:#f7f9fb}text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.h{fill:var(--fg);font-size:17px;font-weight:600}.pt{fill:var(--fg);font-size:15px;font-weight:600}.tx{fill:var(--fg);font-size:12.8px}.sm{fill:var(--muted);font-size:12px}.acc{fill:var(--accent);font-size:12.5px;font-weight:600}.danger{fill:var(--danger);font-size:12.3px;font-weight:600}.panel{fill:var(--panel);stroke:var(--line)}.box{fill:#fff;stroke:var(--line)}.biz{fill:#fff8ef;stroke:var(--accent);stroke-width:1.4}.bad{fill:#fff5f3;stroke:var(--danger)}.ln{stroke:var(--line);stroke-width:1.5;fill:none}.la{stroke:var(--accent);stroke-width:1.8;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c8d1da"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker></defs><text class="h" x="500" y="36" text-anchor="middle">稳定的循环不应承担不断变化的业务规则</text><rect class="panel" x="45" y="72" width="420" height="348" rx="11"/><text class="pt" x="69" y="108">没有 Hook：规则进入内核</text><rect class="bad" x="88" y="138" width="334" height="238" rx="8"/><text class="danger" x="112" y="169">Agent 主循环</text><rect class="box" x="120" y="186" width="270" height="36" rx="6"/><text class="tx" x="255" y="209" text-anchor="middle">调用模型</text><rect class="box" x="120" y="232" width="270" height="36" rx="6"/><text class="tx" x="255" y="255" text-anchor="middle">if 未查询订单 → 拒绝退款</text><rect class="box" x="120" y="278" width="270" height="36" rx="6"/><text class="tx" x="255" y="301" text-anchor="middle">if 未审批 → 拒绝退款</text><rect class="box" x="120" y="324" width="270" height="36" rx="6"/><text class="tx" x="255" y="347" text-anchor="middle">执行工具并写回结果</text><text class="sm" x="255" y="400" text-anchor="middle">业务变化一次，内核修改一次</text><rect class="panel" x="535" y="72" width="420" height="348" rx="11"/><text class="pt" x="559" y="108">引入 Hook：规则留在业务模块</text><rect class="box" x="570" y="138" width="170" height="230" rx="8"/><text class="pt" x="655" y="168" text-anchor="middle">Agent 内核</text><text class="tx" x="655" y="207" text-anchor="middle">调用模型</text><text class="tx" x="655" y="247" text-anchor="middle">调度 Hook</text><text class="tx" x="655" y="287" text-anchor="middle">执行工具</text><text class="tx" x="655" y="327" text-anchor="middle">写回结果</text><rect class="biz" x="786" y="138" width="134" height="230" rx="8"/><text class="acc" x="853" y="168" text-anchor="middle">退款模块</text><text class="tx" x="853" y="207" text-anchor="middle">订单状态</text><text class="tx" x="853" y="247" text-anchor="middle">退款条件</text><text class="tx" x="853" y="287" text-anchor="middle">审批规则</text><text class="tx" x="853" y="327" text-anchor="middle">拒绝原因</text><path class="la" d="M786 254H748" marker-end="url(#aa)"/><text class="acc" x="767" y="238" text-anchor="middle">Hook</text><text class="sm" x="745" y="400" text-anchor="middle">业务规则介入执行流程，但不进入循环源码</text></svg>
