<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="t"><title id="t">图 3-10 复诵把任务状态搬回注意力落点</title><style>svg{--fg:#1f2328;--muted:#6b7280;--line:#c8d1da;--accent:#b45309}text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.h{fill:var(--fg);font-size:17px;font-weight:600}.tx{fill:var(--fg);font-size:13px}.sm{fill:var(--muted);font-size:12px}.acc{fill:var(--accent);font-size:13px;font-weight:600}.msg{fill:#fff;stroke:var(--line)}.old{fill:#f1f3f5;stroke:#d7dde3}.state{fill:#fff8ef;stroke:var(--accent);stroke-width:1.5}.arrow{stroke:var(--accent);stroke-width:2;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker></defs><text class="h" x="500" y="36" text-anchor="middle">不要求模型回头找，把当前状态重新放到末尾</text><text class="sm" x="188" y="72">上下文开头 · 影响逐渐变弱</text><rect class="old" x="170" y="88" width="660" height="44" rx="7"/><text class="sm" x="192" y="115">原始任务：修复登录报错，注意别动现有 API 接口</text><rect class="old" x="194" y="146" width="612" height="36" rx="7"/><text class="sm" x="214" y="169">……前序调查与工具结果……</text><rect class="msg" x="218" y="196" width="564" height="36" rx="7"/><text class="tx" x="238" y="219">[assistant] 修复配置加载顺序</text><rect class="msg" x="242" y="246" width="516" height="36" rx="7"/><text class="tx" x="262" y="269">[tool] PASS 12 / FAIL 1</text><rect class="state" x="170" y="304" width="660" height="112" rx="9"/><text class="acc" x="192" y="330">[因清单变更，回注当前任务状态]</text><text class="tx" x="192" y="356">✓ 定位报错　✓ 修复加载顺序　● 集成测试　○ 补单元测试</text><text class="tx" x="192" y="384">原始任务：修复登录报错，注意别动现有 API 接口</text><text class="sm" x="192" y="405">变化时回注；久未更新时提醒</text><path class="arrow" d="M852 398 C920 385 922 323 844 317" marker-end="url(#a)"/><text class="acc" x="925" y="365" text-anchor="middle">下一轮生成前</text><text class="sm" x="925" y="386" text-anchor="middle">注意力落点</text></svg>
