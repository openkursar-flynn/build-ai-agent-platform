<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="t"><title id="t">图 3-18 子 Agent 隔离的收益与代价</title><style>svg{--fg:#1f2328;--muted:#6b7280;--line:#c8d1da;--accent:#b45309;--danger:#b42318;--panel:#f7f9fb}text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.h{fill:var(--fg);font-size:17px;font-weight:600}.pt{fill:var(--fg);font-size:15px;font-weight:600}.tx{fill:var(--fg);font-size:12.6px}.sm{fill:var(--muted);font-size:11.8px}.acc{fill:var(--accent);font-size:12.3px;font-weight:600}.danger{fill:var(--danger);font-size:12.3px;font-weight:600}.panel{fill:var(--panel);stroke:var(--line)}.box{fill:#fff;stroke:var(--line)}.good{fill:#fff8ef;stroke:var(--accent);stroke-width:1.4}.bad{fill:#fff5f3;stroke:var(--danger);stroke-width:1.3}.ln{stroke:var(--line);stroke-width:1.5;fill:none}.la{stroke:var(--accent);stroke-width:1.8;fill:none}.ld{stroke:var(--danger);stroke-width:1.8;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c8d1da"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b42318"/></marker></defs><text class="h" x="500" y="36" text-anchor="middle">是否派发，取决于后续还需不需要原始细节</text><rect class="panel" x="45" y="72" width="430" height="354" rx="11"/><text class="pt" x="69" y="107">适合：主任务只需要结论</text><rect class="box" x="78" y="136" width="128" height="60" rx="7"/><text class="tx" x="142" y="161" text-anchor="middle">父 Agent</text><text class="sm" x="142" y="181" text-anchor="middle">修复登录 500</text><path class="la" d="M206 166H270" marker-end="url(#aa)"/><rect class="good" x="278" y="124" width="164" height="198" rx="8"/><text class="acc" x="360" y="151" text-anchor="middle">子 Agent 调研</text><text class="tx" x="360" y="179" text-anchor="middle">搜索 × 12</text><text class="tx" x="360" y="205" text-anchor="middle">读取文件 × 30</text><text class="tx" x="360" y="231" text-anchor="middle">排除无关分支</text><text class="sm" x="360" y="271" text-anchor="middle">中间材料留在</text><text class="sm" x="360" y="290" text-anchor="middle">独立上下文</text><path class="la" d="M360 322V352H142V206" marker-end="url(#aa)"/><rect class="good" x="78" y="340" width="246" height="54" rx="7"/><text class="acc" x="201" y="363" text-anchor="middle">一页结论 + 代码依据</text><text class="sm" x="201" y="383" text-anchor="middle">隔离换来更干净的主上下文</text><rect class="panel" x="525" y="72" width="430" height="354" rx="11"/><text class="pt" x="549" y="107">不适合：后续仍依赖原始细节</text><rect class="box" x="558" y="136" width="128" height="60" rx="7"/><text class="tx" x="622" y="161" text-anchor="middle">父 Agent</text><text class="sm" x="622" y="181" text-anchor="middle">逐段讨论代码</text><path class="ln" d="M686 166H750" marker-end="url(#a)"/><rect class="box" x="758" y="124" width="164" height="126" rx="8"/><text class="pt" x="840" y="151" text-anchor="middle">子 Agent</text><text class="tx" x="840" y="180" text-anchor="middle">读取完整文件</text><text class="tx" x="840" y="208" text-anchor="middle">只返回摘要</text><path class="ld" d="M840 250V286H622V206" marker-end="url(#ad)"/><rect class="bad" x="558" y="274" width="364" height="56" rx="7"/><text class="danger" x="740" y="298" text-anchor="middle">用户追问：第三个分支为什么不能删？</text><text class="sm" x="740" y="318" text-anchor="middle">摘要没有原始代码细节</text><path class="ld" d="M740 330V354" marker-end="url(#ad)"/><rect class="bad" x="632" y="362" width="216" height="42" rx="7"/><text class="danger" x="740" y="388" text-anchor="middle">父 Agent 重新读取文件</text></svg>
