<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="t"><title id="t">图 3-17 子 Agent 是工具内部的另一个循环</title><style>svg{--fg:#1f2328;--muted:#6b7280;--line:#c8d1da;--accent:#b45309;--panel:#f7f9fb}text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.h{fill:var(--fg);font-size:17px;font-weight:600}.pt{fill:var(--fg);font-size:14px;font-weight:600}.tx{fill:var(--fg);font-size:12.8px}.sm{fill:var(--muted);font-size:12px}.acc{fill:var(--accent);font-size:12.5px;font-weight:600}.panel{fill:var(--panel);stroke:var(--line)}.box{fill:#fff;stroke:var(--line)}.focus{fill:#fff8ef;stroke:var(--accent);stroke-width:1.5}.dash{fill:#fff8ef;stroke:var(--accent);stroke-width:1.4;stroke-dasharray:6 4}.ln{stroke:var(--line);stroke-width:1.5;fill:none}.la{stroke:var(--accent);stroke-width:1.8;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c8d1da"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker></defs><text class="h" x="500" y="36" text-anchor="middle">对子 Agent 的派发，仍是一次普通工具调用</text><rect class="panel" x="45" y="78" width="285" height="330" rx="11"/><text class="pt" x="69" y="111">主 Agent 的工具清单</text><rect class="box" x="78" y="142" width="219" height="48" rx="7"/><text class="tx" x="187" y="171" text-anchor="middle">read(path)</text><rect class="box" x="78" y="208" width="219" height="48" rx="7"/><text class="tx" x="187" y="237" text-anchor="middle">search(query)</text><rect class="focus" x="78" y="274" width="219" height="76" rx="7"/><text class="acc" x="187" y="303" text-anchor="middle">runSubAgent(prompt)</text><text class="sm" x="187" y="328" text-anchor="middle">模型选择的一个工具</text><path class="la" d="M297 312H402" marker-end="url(#aa)"/><text class="acc" x="349" y="297" text-anchor="middle">任务说明</text><rect class="dash" x="410" y="78" width="540" height="330" rx="12"/><text class="acc" x="434" y="111">runSubAgent 工具内部</text><rect class="box" x="448" y="138" width="464" height="48" rx="7"/><text class="tx" x="680" y="167" text-anchor="middle">[user] 子任务目标、背景、边界、返回要求</text><path class="ln" d="M680 186V218" marker-end="url(#a)"/><rect class="panel" x="500" y="226" width="360" height="104" rx="9"/><text class="sm" x="518" y="248">独立上下文</text><rect class="box" x="522" y="260" width="112" height="42" rx="6"/><text class="tx" x="578" y="286" text-anchor="middle">模型决策</text><rect class="box" x="726" y="260" width="112" height="42" rx="6"/><text class="tx" x="782" y="286" text-anchor="middle">执行工具</text><path class="ln" d="M634 281H718" marker-end="url(#a)"/><path class="ln" d="M782 302V316H578V310" marker-end="url(#a)"/><path class="la" d="M680 330V360" marker-end="url(#aa)"/><rect class="focus" x="500" y="368" width="360" height="48" rx="7"/><text class="acc" x="680" y="397" text-anchor="middle">结论文本 → 主 Agent 的普通工具结果</text><path class="la" d="M500 392H345V365" marker-end="url(#aa)"/></svg>
