<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-labelledby="t"><title id="t">图 3-9 关键信息位置影响模型利用率</title><style>svg{--fg:#1f2328;--muted:#6b7280;--line:#c8d1da;--accent:#b45309}text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.h{fill:var(--fg);font-size:17px;font-weight:600}.tx{fill:var(--fg);font-size:13px}.sm{fill:var(--muted);font-size:12.5px}.axis{stroke:var(--line);stroke-width:1.3}.grid{stroke:var(--line);stroke-dasharray:4 6}.curve{fill:none;stroke:var(--accent);stroke-width:3}.curve2{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:7 5}.zone{fill:#fff8ef}.acc{fill:var(--accent);font-size:12.5px;font-weight:600}</style><text class="h" x="500" y="38" text-anchor="middle">信息在窗口里，不等于信息会参与判断</text><rect class="zone" x="380" y="72" width="240" height="278" rx="8"/><line class="axis" x1="110" y1="350" x2="920" y2="350"/><line class="axis" x1="110" y1="350" x2="110" y2="72"/><line class="grid" x1="110" y1="140" x2="920" y2="140"/><line class="grid" x1="110" y1="245" x2="920" y2="245"/><path class="curve" d="M120 116 C250 132 322 240 500 270 C678 240 750 132 910 105"/><path class="curve2" d="M120 170 C260 192 342 285 500 307 C658 285 748 190 910 160"/><text class="acc" x="500" y="329" text-anchor="middle">中间位置：利用率最低</text><text class="tx" x="515" y="401" text-anchor="middle">关键信息在上下文中的位置</text><text class="tx" x="38" y="214" text-anchor="middle" transform="rotate(-90 38 214)">回答准确率</text><text class="sm" x="115" y="372">开头</text><text class="sm" x="500" y="372" text-anchor="middle">中间</text><text class="sm" x="915" y="372" text-anchor="end">结尾</text><line x1="700" y1="66" x2="740" y2="66" class="curve"/><text class="sm" x="750" y="70">较短上下文</text><line x1="700" y1="88" x2="740" y2="88" class="curve2"/><text class="sm" x="750" y="92">更长上下文</text></svg>
