<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="t d">
<title id="t">图 3-3 模型在房间里，循环在门外执行工具</title>
<desc id="d">房间里的人只能看到桌上的上下文纸条。他写出一张指令纸条，从贯穿墙体的门缝递出去；门外的循环助手接住指令，调用文件系统、终端命令、网络请求等工具，把结果写成返回纸条，再从同一条门缝递回来，叠到上下文纸条上。</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.head{fill:#20242b;font-size:16px;font-weight:600}
.body{fill:#20242b;font-size:14px}
.small{fill:#667085;font-size:13px}
.tag{fill:#b45309;font-size:12px;font-weight:600}
.accent{fill:#b45309;font-size:13px;font-weight:600}
.panel{fill:#f8fafc;stroke:#aab5c3;stroke-width:1.4}
.box{fill:#ffffff;stroke:#c2ccd8;stroke-width:1.4}
.actor{fill:#eaf0f7;stroke:#93a3b6;stroke-width:1.5}
.paper{fill:#fff7ed;stroke:#b45309;stroke-width:1.6}
.pill{fill:#ffffff;stroke:#b45309;stroke-width:1.4}
.rule{stroke:#cf9a4f;stroke-width:1.2;stroke-linecap:round}
.figure{fill:none;stroke:#93a3b6;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.head-fill{fill:#f8fafc;stroke:#93a3b6;stroke-width:1.8}
.tool{fill:none;stroke:#98a5b5;stroke-width:1.6;stroke-linecap:round}
.flow{fill:none;stroke:#b45309;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
</style>
<defs>
<marker id="ge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#98a5b5"/></marker>
<marker id="gs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 0 5 10 10Z" fill="#98a5b5"/></marker>
<marker id="oe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#b45309"/></marker>
</defs>

<!-- ============ panels ============ -->
<rect class="panel" x="55" y="30" width="445" height="420" rx="12"/>
<rect class="panel" x="585" y="30" width="460" height="420" rx="12"/>
<text class="head" x="278" y="62" text-anchor="middle">房间内部（无窗）</text>
<text class="head" x="815" y="62" text-anchor="middle">门外（循环代码 + 外部工具）</text>
<line x1="71" y1="82" x2="484" y2="82" stroke="#d7dee7"/>
<line x1="601" y1="82" x2="1029" y2="82" stroke="#d7dee7"/>

<!-- ============ wall + slit：缝贯穿整个墙厚，只画上下两条边 ============ -->
<rect x="500" y="30" width="85" height="420" fill="#e5eaf1" stroke="#aab5c3" stroke-width="1.4"/>
<rect x="500" y="226" width="85" height="38" fill="#fdfbf6"/>
<line x1="500" y1="226" x2="585" y2="226" stroke="#93a3b6" stroke-width="1.5"/>
<line x1="500" y1="264" x2="585" y2="264" stroke="#93a3b6" stroke-width="1.5"/>
<text class="accent" x="542" y="214" text-anchor="middle" font-size="14">门缝</text>
<text x="542" y="284" text-anchor="middle" font-size="12" fill="#5b6675">唯一通道</text>

<!-- ============ 房间：人坐在桌前 ============ -->
<path class="figure" d="M144 310C144 244 152 186 184 186C216 186 224 244 224 310"/>
<circle class="head-fill" cx="184" cy="172" r="26"/>
<path class="figure" d="M218 238C240 236 250 226 259 217"/>
<line class="figure" x1="116" y1="310" x2="382" y2="310"/>
<line class="figure" x1="134" y1="310" x2="134" y2="352"/>
<line class="figure" x1="366" y1="310" x2="366" y2="352"/>

<!-- 桌上的上下文纸条 -->
<rect class="paper" x="244" y="246" width="104" height="64" rx="5"/>
<line class="rule" x1="256" y1="262" x2="332" y2="262"/>
<line class="rule" x1="256" y1="274" x2="324" y2="274"/>
<line class="rule" x1="256" y1="286" x2="330" y2="286"/>
<line class="rule" x1="256" y1="298" x2="312" y2="298"/>
<text class="accent" x="296" y="336" text-anchor="middle">上下文纸条</text>

<!-- 手里刚写好的指令纸条 -->
<rect class="paper" x="262" y="190" width="66" height="30" rx="4"/>
<line class="rule" x1="272" y1="198" x2="318" y2="198"/>
<line class="rule" x1="272" y1="206" x2="312" y2="206"/>
<line class="rule" x1="272" y1="214" x2="316" y2="214"/>

<!-- ============ 两条流线：上出下回，不交叉、不断口 ============ -->
<path class="flow" d="M328 205C362 205 364 228 396 228H462C482 228 480 238 500 238H628" marker-end="url(#oe)"/>
<path class="flow" d="M628 252H500C480 252 482 262 462 262H358" marker-end="url(#oe)"/>

<rect class="pill" x="392" y="217" width="72" height="22" rx="4"/>
<text class="tag" x="428" y="232" text-anchor="middle">指令纸条</text>
<rect class="pill" x="392" y="251" width="72" height="22" rx="4"/>
<text class="tag" x="428" y="266" text-anchor="middle">返回纸条</text>

<!-- ============ 房间图注（是标注，不是节点，没有箭头指向它）============ -->
<rect x="85" y="370" width="385" height="56" rx="9" fill="#eaf0f7" stroke="#b9c5d3" stroke-width="1.3"/>
<text class="head" x="277" y="394" text-anchor="middle">大语言模型</text>
<text class="small" x="277" y="414" text-anchor="middle">只能看到纸条，看不到外部世界</text>

<!-- ============ 循环助手 ============ -->
<rect class="actor" x="628" y="180" width="220" height="124" rx="11"/>
<text class="head" x="738" y="212" text-anchor="middle">循环助手</text>
<text class="small" x="738" y="240" text-anchor="middle">接收指令，执行工具</text>
<text class="small" x="738" y="264" text-anchor="middle">把结果写成新纸条</text>
<text class="small" x="738" y="288" text-anchor="middle">不替模型做判断</text>

<!-- ============ 外部工具：双向，结果要回来 ============ -->
<rect class="box" x="898" y="140" width="110" height="54" rx="9"/><text class="body" x="953" y="172" text-anchor="middle">文件系统</text>
<rect class="box" x="898" y="215" width="110" height="54" rx="9"/><text class="body" x="953" y="247" text-anchor="middle">终端命令</text>
<rect class="box" x="898" y="290" width="110" height="54" rx="9"/><text class="body" x="953" y="322" text-anchor="middle">网络请求</text>
<path class="tool" d="M850 205 896 169" marker-start="url(#gs)" marker-end="url(#ge)"/>
<path class="tool" d="M850 242 896 242" marker-start="url(#gs)" marker-end="url(#ge)"/>
<path class="tool" d="M850 279 896 315" marker-start="url(#gs)" marker-end="url(#ge)"/>

<text class="small" x="815" y="392" text-anchor="middle">请求和结果都追加进 messages 数组</text>
<text class="small" x="815" y="414" text-anchor="middle">整叠纸条再递给模型，开始下一轮</text>

<text class="accent" x="550" y="486" text-anchor="middle">纸条 = 上下文（messages 数组）· 门缝 = 唯一通道 · 助手 = 循环代码</text>
</svg>
